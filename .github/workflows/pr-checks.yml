name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin

jobs:
  tracebox:
    name: Andy tracebox checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned tracebox manifests
        run: |
          python3 -m unittest discover -s tools/andy-tracebox -p 'test_*.py'
          python3 tools/andy-tracebox/package_release.py --verify-manifest-only

  desktop-test:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Opt-in harnesses that are safe / free to run on every PR.
      ANDY_PROXY_CONFORMANCE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python (pinned mitmproxy venv / conformance)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxrender1 libxi6 libxrandr2

      - name: Run Linux desktop tests
        if: matrix.os == 'linux'
        run: xvfb-run -a ./gradlew desktopTest "-PandyRetryTests=true"

      - name: Install tmux (agent terminal executor)
        if: matrix.os == 'macos'
        run: brew install tmux || true

      # iOS Simulator "Live" smoke tests (IosSimMirrorDeviceSmokeTest) are intentionally NOT run
      # on CI: driving a real GPU mirror + AWT Robot HID against a headless-ish runner is
      # inherently flaky and has hung the job to the 60m limit. Without ANDY_IOS_SIM_SMOKE the
      # tests assumeTrue-skip. Run them locally with a booted simulator when needed.

      - name: Run macOS desktop tests
        if: matrix.os == 'macos'
        run: ./gradlew desktopTest "-PandyRetryTests=true"

      - name: Run Windows desktop tests
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./gradlew.bat desktopTest "-PandyRetryTests=true"

      - name: Upload desktop test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-${{ matrix.os }}-reports
          if-no-files-found: ignore
          path: |
            build/reports/tests/**
            build/test-results/**

  desktop-screenshots:
    name: Desktop screenshots (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxrender1 libxi6 libxrandr2

      - name: Verify Linux desktop screenshots
        if: matrix.os == 'linux'
        run: xvfb-run -a ./gradlew verifyRoborazziDesktop --tests 'app.andy.AndyDesktopScreenshotTest'

      - name: Verify macOS desktop screenshots
        if: matrix.os == 'macos'
        run: ./gradlew verifyRoborazziDesktop --tests 'app.andy.AndyDesktopScreenshotTest'

      - name: Verify Windows desktop screenshots
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./gradlew.bat verifyRoborazziDesktop --tests 'app.andy.AndyDesktopScreenshotTest'

      - name: Upload desktop screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-${{ matrix.os }}-artifacts
          if-no-files-found: ignore
          path: |
            build/reports/roborazzi/**
            build/outputs/roborazzi/**
            build/intermediates/roborazzi/**
            build/test-results/roborazzi/**

  assemble:
    name: Desktop assemble (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxrender1 libxi6 libxrandr2

      - name: Assemble Linux desktop app
        if: matrix.os == 'linux'
        run: xvfb-run -a ./gradlew assemble

      - name: Assemble macOS desktop app
        if: matrix.os == 'macos'
        run: ./gradlew assemble

      - name: Assemble Windows desktop app
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./gradlew.bat assemble

  agent-store:
    name: agent-store build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build agent-store
        run: ./gradlew :agent-store:build

  web-launcher-test:
    name: Web launcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Run web launcher tests
        run: ./gradlew :web-launcher:test

  andy-cli:
    name: Andy CLI build
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Andy Rust CLI
        run: |
          rustup show || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo build --manifest-path cli/andy/Cargo.toml

  web-preview-deploy:
    name: Deploy web preview to GitHub Pages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: web-preview
      url: https://andy-test.joetr.com/
    env:
      PAGES_PREVIEW_DEPLOY_KEY: ${{ secrets.PAGES_PREVIEW_DEPLOY_KEY }}
      PAGES_PREVIEW_REPOSITORY: ${{ secrets.PAGES_PREVIEW_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Wasm Binaryen
        uses: actions/cache@v4
        with:
          path: ~/.gradle/binaryen
          key: ${{ runner.os }}-kotlin-wasm-binaryen-${{ hashFiles('build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-wasm-binaryen-

      - name: Validate web preview deploy settings
        shell: bash
        run: |
          missing=()
          [[ -n "${PAGES_PREVIEW_DEPLOY_KEY}" ]] || missing+=("PAGES_PREVIEW_DEPLOY_KEY")
          [[ -n "${PAGES_PREVIEW_REPOSITORY}" ]] || missing+=("PAGES_PREVIEW_REPOSITORY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required web preview deploy settings: ${missing[*]}"
            exit 1
          fi

      - name: Build web bundle
        run: ./gradlew wasmJsBrowserDistribution

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${PAGES_PREVIEW_DEPLOY_KEY}" > "${HOME}/.ssh/preview_pages_key"
          ssh-keyscan github.com > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/preview_pages_key"

      - name: Deploy web preview bundle to preview Pages repository
        shell: bash
        run: |
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/preview_pages_key"
          repository_url="git@github.com:${PAGES_PREVIEW_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${repository_url}" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "${repository_url}" preview-pages
          else
            git clone "${repository_url}" preview-pages
            (
              cd preview-pages
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          rsync -a --delete --exclude .git \
            build/dist/wasmJs/productionExecutable/ \
            preview-pages/
          touch preview-pages/.nojekyll
          cp preview-pages/index.html preview-pages/404.html
          printf 'andy-test.joetr.com\n' > preview-pages/CNAME

          (
            cd preview-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No preview Pages changes to deploy."
            else
              git commit -m "Deploy Andy preview from ${GITHUB_SHA}"
              git push origin gh-pages
            fi
          )
