name: Record desktop screenshot baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin

jobs:
  record:
    name: Record macOS baselines
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Record macOS baselines
        run: ./gradlew --rerun-tasks recordRoborazziDesktop --tests 'app.andy.AndyDesktopScreenshotTest'

      - name: Upload recorded baselines
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-macos-baselines
          path: src/screenshotTest/roborazzi/macos/
          if-no-files-found: error

      - name: Upload Roborazzi report
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-macos-report
          path: |
            build/reports/roborazzi/**
            build/test-results/roborazzi/**
