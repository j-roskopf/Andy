[package]
name = "andy_mermaid"
version = "0.1.0"
edition = "2021"
description = "Headless Mermaid renderer for Andy chat, exposed to the JVM via JNI"
license = "MIT"
publish = false

[lib]
name = "andy_mermaid"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
merman = { version = "=0.8.0-alpha.5", features = ["png"] }
