[package]
name = "andy"
version = "0.1.0"
edition = "2021"
description = "Andy CLI — MCP client for andyd over a Unix domain socket"
license = "MIT"

[lib]
name = "andy_cli"
path = "src/lib.rs"

[[bin]]
name = "andy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "sync"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
dirs = "6.0"
base64 = "0.22"
termimad = "0.31"
syntect = "5.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.19"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde_json = "1.0"
